name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Install + smoke import
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke import test
        run: |
          python -c "
          import src
          import src.preprocess
          import src.ocr_trocr
          import src.postcorrect
          import src.classify
          import src.ner
          import src.flagger
          import src.pipeline
          import src.batch
          print('all imports ok')
          "
