name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Install + smoke import
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        env:
          # Authenticated HF access for higher download rate limits.
          # Required once CI starts pulling model weights.
          # Set as a GitHub Actions repo secret: Settings -> Secrets and
          # variables -> Actions -> New repository secret (name: HF_TOKEN).
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke import test
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import src
          import src.preprocess
          import src.ocr_trocr
          import src.postcorrect
          import src.classify
          import src.ner
          import src.flagger
          import src.pipeline
          import src.batch
          from src.postcorrect import CorrectedLine, post_correct
          from src.classify import ClassifyResult, classify
          from src.ner import Entity, extract_entities
          from src.batch import CSV_COLUMNS
          import scripts.cache_iam_gw
          import scripts.extract_for_ood_labeling
          import py_compile; py_compile.compile('scripts/label_for_ood.py', doraise=True)
          import py_compile; py_compile.compile('app.py', doraise=True)
          print('all imports ok')
          "
